<template>
  <lightning-quick-action-panel header="Escalate Approval">
    <div>

      <div class="slds-path">
        <div class="slds-grid slds-path__track">
          <div class="slds-grid slds-path__scroller-container">
            <div class="slds-path__scroller">
              <div class="slds-path__scroller_inner">
                <ul class="slds-path__nav" role="listbox" aria-orientation="horizontal"
                  aria-labelledby="slds-path__stage-name">
                  <template for:each={Approvers} for:item="item">
                    <li class="slds-path__item slds-is-complete" role="presentation" key={item} lwc:if={item.approved}>
                      <a aria-selected="false" class="slds-path__link" href="#" id="path-6" role="option" tabindex="-1">
                        <span class="slds-path__stage">
                          <svg class="slds-icon slds-icon_x-small" aria-hidden="true">
                            <use xlink:href="/_slds/icons/utility-sprite/svg/symbols.svg#check"></use>
                          </svg>
                          <span class="slds-assistive-text">Stage Complete</span>
                        </span>
                        <span class="slds-path__title">{item.approverName}</span>
                      </a>
                    </li>
                    <li class="slds-path__item slds-is-current slds-is-active" role="presentation" key={item}
                      lwc:elseif={item.currentApproval}>
                      <a aria-selected="true" class="slds-path__link" href="#" id="path-9" role="option" tabindex="0">
                        <span class="slds-path__stage">
                          <svg class="slds-icon slds-icon_x-small" aria-hidden="true">
                            <use xlink:href="/_slds/icons/utility-sprite/svg/symbols.svg#check"></use>
                          </svg>
                          <span class="slds-assistive-text">Current Stage:</span>
                        </span>
                        <span class="slds-path__title">{item.approverName}</span>
                      </a>
                    </li>
                    <li class="slds-path__item slds-is-incomplete" role="presentation" key={item} lwc:else>
                      <a aria-selected="false" class="slds-path__link" href="#" id="path-10" role="option"
                        tabindex="-1">
                        <span class="slds-path__stage">
                          <svg class="slds-icon slds-icon_x-small" aria-hidden="true">
                            <use xlink:href="/_slds/icons/utility-sprite/svg/symbols.svg#check"></use>
                          </svg>
                        </span>
                        <span class="slds-path__title">{item.approverName}</span>
                      </a>
                    </li>
                  </template>
                </ul>
              </div>
            </div>
          </div>

          <div class="slds-grid slds-path__action">
            <span id="slds-path__stage-name" class="slds-path__stage-name">Stage: Unqualified</span>
            <button class="slds-button slds-button_brand slds-path__mark-complete" onclick={escalateApprover}>
              <svg class="slds-button__icon slds-button__icon_left" aria-hidden="true">
                <use xlink:href="/_slds/icons/utility-sprite/svg/symbols.svg#check"></use>
              </svg>Escalate</button>
          </div>
        </div>
      </div>
      <lightning-textarea max-length="100" name="inputName" placeholder="Reason For Escalation" required="true"
        onchange={handleComment} value={comment} variant="standard"></lightning-textarea>

    </div>
  </lightning-quick-action-panel>
</template>
