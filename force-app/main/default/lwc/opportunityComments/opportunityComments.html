<template>
    <lightning-card icon-name="utility:comments" variant="base" title={title}>
        <div slot="actions" class="slds-grid slds-grid_align-spread">
            <lightning-button label="New" variant="brand" onclick={openModalForNewComment}></lightning-button>
        </div>

        <div class="slds-p-horizontal_small slds-p-vertical_small">
            <!-- Spinner to indicate loading -->
            <template if:true={isLoading}>
                <div class="slds-align_absolute-center">
                    <lightning-spinner alternative-text="Loading comments..." size="medium"></lightning-spinner>
                </div>
            </template>

            <!-- Comments section -->
            <template if:false={isLoading}>
                <template if:true={comments} for:each={comments} for:item="comment">
                    <lightning-layout key={comment.comment_OpportunityId} class="slds-p-vertical_x-small">
                        <lightning-layout-item size="12">
                            <div class="comment-header slds-grid slds-grid_align-spread slds-p-bottom_x-small">
                                <div class="slds-text-heading_small">
                                    <lightning-avatar variant="circle" size="small"
                                        src={comment.smallPhotoUrl}></lightning-avatar>
                                    <lightning-formatted-url value={comment.userLink} tooltip={comment.CreatedByName}
                                        class="slds-m-left_xx-small" label={comment.CreatedByName}
                                        target="_blank"></lightning-formatted-url>
                                </div>
                                <div class="slds-text-body_small slds-text-color_weak">
                                    {comment.formattedCreatedDate}
                                </div>
                            </div>
                            <div class="comment-body slds-text-body_regular">
                                <lightning-formatted-rich-text value={comment.comment}></lightning-formatted-rich-text>

                            </div>
                        </lightning-layout-item>
                    </lightning-layout>
                </template>

                <template if:true={showNoComment}>
                    <div class="slds-text-body_regular slds-text-align_center slds-p-vertical_medium">
                        No comments available.
                    </div>
                </template>
            </template>
        </div>

        <div slot="footer">
            <p class="view-all-text" onclick={handleViewMore}>View All</p>
        </div>


    </lightning-card>


    <template if:true={isShowModal}>

        <!--
            I Used SLDS for this code
            Here is link https://www.lightningdesignsystem.com/components/modals/
        -->

        <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true"
            aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <!-- modal header start -->
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                        title="Close" onclick={closeModalForNewComment}>
                        <lightning-icon icon-name="utility:close" alternative-text="close" variant="inverse"
                            size="small"></lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button>
                    <h2 id="modal-heading-01" class="slds-text-heading_medium slds-hyphenate">Add New Comment</h2>
                </header>

                <!-- modal body start -->
                <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
                    <div>

                        <lightning-layout horizontal-align="center" vertical-align="start" multiple-rows="true">
                            <!-- <lightning-layout-item size="12" alignment-bump="left" flexibility="auto"
                                large-device-size="6" medium-device-size="6" small-device-size="12"
                                padding="horizontal-small">
                                <lightning-input type="date" name="Created Date" label="Created Date" disabled
                                    value={getDate}></lightning-input>
                            </lightning-layout-item>
                            <lightning-layout-item size="12" alignment-bump="left" flexibility="auto"
                                large-device-size="6" medium-device-size="6" small-device-size="12"
                                padding="horizontal-small">
                                <lightning-record-picker label="Current User" object-api-name="User" value={userId}
                                    disabled></lightning-record-picker>
                            </lightning-layout-item> -->
                            <lightning-layout-item size="12" alignment-bump="left" flexibility="auto"
                                large-device-size="12" medium-device-size="12" small-device-size="12"
                                padding="horizontal-small">
                                <lightning-textarea max-length="1000" name="Comment" label="Comment"
                                    placeholder="Type Your Comment here..." value={value} onchange={handleChange}
                                    variant="standard"></lightning-textarea>
                            </lightning-layout-item>
                        </lightning-layout>

                    </div>
                </div>

                <!-- modal footer start-->
                <footer class="slds-modal__footer">
                    <lightning-button variant="neutral" label="Close"
                        onclick={closeModalForNewComment}></lightning-button>
                    <lightning-button variant="brand" label="Save" onclick={createComment}
                        class="slds-m-left_x-small"></lightning-button>
                </footer>

            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
