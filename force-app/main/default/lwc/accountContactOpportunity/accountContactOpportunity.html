<!-- sldsValidatorIgnore -->
<template>
    <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="modal-heading-01"
        class="slds-modal slds-fade-in-open slds-modal_large">
        <div class="slds-modal__container">
            <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse">
                <lightning-icon icon-name="utility:close" variant="inverse"></lightning-icon>
            </button>
            <div class="slds-modal__header">
                <h1 class="slds-modal__title slds-hyphenate" tabindex="-1">Create Account Contact Opportunity</h1>
            </div>
            <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
                <div class="slds-section slds-is-open">
                    <h3 class="slds-section__title slds-theme_shade">
                        <span class="slds-truncate slds-p-horizontal_small" title="Account Information">Account Information</span>
                    </h3>
                    <div class="slds-section__content">
                        <lightning-record-edit-form object-api-name="Account" density="comfy">
                            <lightning-layout multiple-rows="true">
                                <lightning-layout-item size="12" large-device-size="6" medium-device-size="6" small-device-size="12" padding="horizontal-small">
                                    <lightning-input-field field-name="Name"></lightning-input-field>
                                </lightning-layout-item>
                                <lightning-layout-item size="12" large-device-size="6" medium-device-size="6" small-device-size="12" padding="horizontal-small">
                                    <lightning-input-field field-name="Site"></lightning-input-field>
                                </lightning-layout-item>
                                <lightning-layout-item size="12" large-device-size="6" medium-device-size="6" small-device-size="12" padding="horizontal-small">
                                    <lightning-input-field field-name="AccountSource"></lightning-input-field>
                                </lightning-layout-item>
                                <lightning-layout-item size="12" large-device-size="6" medium-device-size="6" small-device-size="12" padding="horizontal-small">
                                    <lightning-input-field field-name="Industry"></lightning-input-field>
                                </lightning-layout-item>
                            </lightning-layout>
                        </lightning-record-edit-form>
                    </div>
                </div>
                <div class="slds-section slds-is-open">
                    <h3 class="slds-section__title slds-theme_shade">
                        <span class="slds-truncate slds-p-horizontal_small" title="Contact Information">Contact Information</span>
                    </h3>
                    <div class="slds-section__content">
                        <lightning-record-edit-form object-api-name="Contact">
                            <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_col-bordered">
                                <thead>
                                    <tr class="slds-line-height_reset">
                                        <th class="" scope="col">
                                            <div class="slds-truncate" title="Serial Number">#</div>
                                        </th>
                                        <th class="" scope="col">
                                            <div class="slds-truncate" title="Name">Name</div>
                                        </th>
                                        <th class="" scope="col">
                                            <div class="slds-truncate" title="Email">Email</div>
                                        </th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template for:each={contacts} for:item="item" for:index="index">
                                        <tr key={item.LastName} class="slds-hint-parent">
                                            <td data-label="Account Name">
                                                {item.SerialNumber}
                                            </td>
                                            <td data-label="Account Name">
                                                <!-- <lightning-input-field data-index={index} field-name="LastName" variant="label-hidden" value={item.LastName} onchange={HandleChangeContacts}></lightning-input-field> -->
                                                <lightning-input name="LastName" data-index={index} variant="label-hidden" value={item.LastName} onchange={HandleChangeContacts}></lightning-input>
                                            </td>
                                            <td data-label="Close Date">
                                                <lightning-input name="Email" data-index={index} variant="label-hidden" value={item.Email} onchange={HandleChangeContacts}></lightning-input>
                                                <!-- <lightning-input-field data-index={index} field-name="Email" variant="label-hidden" value={item.Email} onchange={HandleChangeContacts}></lightning-input-field> -->
                                            </td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </lightning-record-edit-form>
                    </div>
                </div>
            </div>
            <div class="slds-modal__footer">
                <div style="display: flex; justify-content: space-between;">
                    <div>
                        <button class="slds-button slds-button_neutral" onclick={HandleAddContact}>Add Another Contact</button>
                    </div>
                    <div>
                        <button class="slds-button slds-button_neutral">Cancel</button>
                        <button class="slds-button slds-button_brand" onclick={HandleSave}>Save</button>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
</template>
